plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.sonarqube' version '7.5.0.8588'
	id 'info.solidsoft.pitest' version '1.19.0'
}

group = 'com.proyect'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-h2console'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	runtimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

pitest {
	pitestVersion = '1.19.4'
	junit5PluginVersion = '1.2.3'

	targetClasses = ['com.proyect.POO.model.Espacios']
	targetTests = ['com.proyect.POO.model.EspaciosTest']

	threads = 4
	outputFormats = ['HTML', 'XML']
	timestampedReports = false
}

sonar {
	properties {
		property 'sonar.projectKey', 'demo-calidad'
		property 'sonar.projectName', 'Proyecto Demo Calidad'
		property 'sonar.host.url', 'http://localhost:9000'
	}
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy(tasks.named('pitest'))
}
